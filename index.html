<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Académico 2026 - Fechas Importantes</title>
  <meta name="description" content="Calendario Académico 2026 con fechas importantes, parciales, recuperatorios, coloquios, integradores y entregas.">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       DESIGN SYSTEM & UTILITIES
       ========================================================================== */
    :root {
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;

      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;

      /* Primary Brand Colors */
      --header-bg: #0b1f48;
      --header-accent: #1e3a8a;

      /* Category Colors */
      --cat-parcial-color: #1d4ed8;
      --cat-parcial-bg: #dbeafe;
      --cat-parcial-border: #93c5fd;

      --cat-recup-color: #b91c1c;
      --cat-recup-bg: #fee2e2;
      --cat-recup-border: #fca5a5;

      --cat-coloquio-color: #6b21a8;
      --cat-coloquio-bg: #f3e8ff;
      --cat-coloquio-border: #d8b4fe;

      --cat-integrador-color: #15803d;
      --cat-integrador-bg: #dcfce7;
      --cat-integrador-border: #86efac;

      --cat-entrega-color: #c2410c;
      --cat-entrega-bg: #ffedd5;
      --cat-entrega-border: #fdba74;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.4;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      padding: 20px;
      border: 1px solid #e2e8f0;
    }

    /* ==========================================================================
       HEADER & NAVIGATION BAR
       ========================================================================== */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #0b1f48 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 10px;
      margin-bottom: 20px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b1f48;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 1px;
    }

    /* Legend Bar */
    .legend-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
      user-select: none;
    }

    .legend-item:hover, .legend-item.active {
      background: #ffffff;
      color: #0b1f48;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f8fafc;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      flex-grow: 1;
      max-width: 400px;
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      font-family: var(--font-body);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0b1f48;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1e3a8a;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }

    /* ==========================================================================
       MAIN CONTENT GRID LAYOUT
       ========================================================================== */
    .layout-grid {
      display: grid;
      grid-template-columns: 340px 1fr 220px;
      gap: 20px;
    }

    @media (max-width: 1300px) {
      .layout-grid {
        grid-template-columns: 320px 1fr;
      }
      .right-panel {
        grid-column: span 2;
      }
    }

    @media (max-width: 900px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
      .right-panel {
        grid-column: span 1;
      }
    }

    /* ==========================================================================
       LEFT SIDEBAR - SUBJECT CARDS
       ========================================================================== */
    .sidebar-left {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .subject-card {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .subject-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .subject-card.highlighted {
      ring: 2px solid #2563eb;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .subject-header {
      color: #ffffff;
      padding: 6px 12px;
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .subject-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    .subject-table tr {
      border-bottom: 1px solid #f1f5f9;
    }
    .subject-table tr:last-child {
      border-bottom: none;
    }

    .subject-table td {
      padding: 5px 10px;
      vertical-align: middle;
    }

    .subject-table td.event-name {
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subject-table td.event-date {
      text-align: right;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
    }

    .event-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ==========================================================================
       CENTER AREA - MONTHLY CALENDARS
       ========================================================================== */
    .calendar-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .month-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .month-header {
      background: #0b1f48;
      color: #ffffff;
      text-align: center;
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 800;
      padding: 8px;
      letter-spacing: 1px;
    }

    .month-days-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #1e3a8a;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 4px 0;
      letter-spacing: 0.5px;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(75px, auto);
      border-left: 1px solid #e2e8f0;
      border-top: 1px solid #e2e8f0;
    }

    .day-cell {
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      background: #ffffff;
      padding: 4px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 75px;
      transition: background 0.15s ease;
    }

    .day-cell.other-month {
      background-color: #f8fafc;
      color: #94a3b8;
    }

    .day-cell.today {
      background-color: #f0f9ff;
    }

    .day-number {
      font-size: 12px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 2px;
    }
    .day-cell.other-month .day-number {
      color: #94a3b8;
      font-weight: 500;
    }

    /* Event Badges & Spans */
    .event-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      line-height: 1.25;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border-left: 3px solid transparent;
      transition: transform 0.15s ease, filter 0.15s ease;
      word-break: break-word;
    }

    .event-pill:hover {
      transform: scale(1.02);
      filter: brightness(0.95);
      z-index: 10;
    }

    .event-pill.dimmed {
      opacity: 0.25;
    }
    .event-pill.highlighted-pill {
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
      z-index: 20;
    }

    /* Category Specific Styles */
    .cat-parciales {
      background-color: var(--cat-parcial-bg);
      color: var(--cat-parcial-color);
      border-left-color: var(--cat-parcial-color);
    }
    .cat-recuperatorios {
      background-color: var(--cat-recup-bg);
      color: var(--cat-recup-color);
      border-left-color: var(--cat-recup-color);
    }
    .cat-coloquios {
      background-color: var(--cat-coloquio-bg);
      color: var(--cat-coloquio-color);
      border-left-color: var(--cat-coloquio-color);
    }
    .cat-integradores {
      background-color: var(--cat-integrador-bg);
      color: var(--cat-integrador-color);
      border-left-color: var(--cat-integrador-color);
    }
    .cat-entregas {
      background-color: var(--cat-entrega-bg);
      color: var(--cat-entrega-color);
      border-left-color: var(--cat-entrega-color);
    }

    /* ==========================================================================
       RIGHT PANEL - IMPORTANT NOTICE & MODAL
       ========================================================================== */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .notice-card {
      border: 2px dashed #0b1f48;
      border-radius: 10px;
      background: #f8fafc;
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .notice-icon {
      width: 48px;
      height: 48px;
      background: #0b1f48;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .notice-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 800;
      color: #0b1f48;
      letter-spacing: 1px;
    }

    .notice-text {
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 12px;
      max-width: 480px;
      width: 90%;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #64748b;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14px;
    }

    .modal-field {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 6px;
    }

    .modal-label {
      font-weight: 600;
      color: #64748b;
    }

    .modal-value {
      font-weight: 700;
      color: #0f172a;
    }

    /* ==========================================================================
       PRINT MEDIA STYLES
       ========================================================================== */
    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .container {
        box-shadow: none;
        border: none;
        padding: 0;
        max-width: 100%;
      }
      .controls-bar {
        display: none;
      }
      .layout-grid {
        grid-template-columns: 280px 1fr 180px;
        gap: 10px;
      }
      .event-pill {
        box-shadow: none;
      }
    }
  </style>
</head>

    /* ==========================================================================
       STATE MANAGEMENT & RENDER ENGINE
       ========================================================================== */
    let selectedCategory = null;
    let selectedSubjectId = null;
    let searchQuery = "";

    document.addEventListener("DOMContentLoaded", () => {
      renderLegend();
      renderSidebarSubjects();
      renderCalendars();
      setupSearch();
    });

    // 1. Render Category Legend
    function renderLegend() {
      const container = document.getElementById("legend-container");
      container.innerHTML = academicCalendarData.categories.map(cat => `
        <div class="legend-item" data-category="${cat.id}" onclick="filterCategory('${cat.id}')">
          <span class="legend-dot" style="background-color: ${cat.color};"></span>
          <span>${cat.label}</span>
        </div>
      `).join('');
    }

    // Helper for accent-insensitive search matching
    function normalizeStr(str) {
      return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    // 2. Render Left Sidebar Subject Cards
    function renderSidebarSubjects() {
      const container = document.getElementById("sidebar-left");
      const normalizedQuery = normalizeStr(searchQuery);

      container.innerHTML = academicCalendarData.subjects.map(subject => {
        const matchingEvents = subject.events.filter(ev => {
          if (selectedCategory && ev.category !== selectedCategory) return false;
          if (normalizedQuery && !normalizeStr(ev.title).includes(normalizedQuery) && !normalizeStr(subject.name).includes(normalizedQuery)) return false;
          return true;
        });

        if (selectedCategory && matchingEvents.length === 0 && !normalizeStr(subject.name).includes(normalizedQuery)) {
          return ''; // Hide subject card if filtering active and no match
        }

        return `
          <div class="subject-card ${selectedSubjectId === subject.id ? 'highlighted' : ''}" onclick="toggleSubjectHighlight('${subject.id}')">
            <div class="subject-header" style="background-color: ${subject.headerBg};">
              <span>${subject.name}</span>
            </div>
            <table class="subject-table">
              <tbody>
                ${subject.events.map(ev => {
                  const cat = getCategory(ev.category);
                  return `
                    <tr onclick="event.stopPropagation(); openEventModal('${ev.id}')">
                      <td class="event-name">
                        <span class="event-dot" style="background-color: ${cat.color}"></span>
                        <span>${ev.title}</span>
                      </td>
                      <td class="event-date">${ev.dateStr}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }).join('');
    }

    // Helper to get category definition
    function getCategory(catId) {
      return academicCalendarData.categories.find(c => c.id === catId) || { color: '#000', bg: '#fff' };
    }

    // Helper to get subject definition
    function getSubjectByEvent(eventId) {
      for (const subj of academicCalendarData.subjects) {
        const ev = subj.events.find(e => e.id === eventId);
        if (ev) return { subject: subj, event: ev };
      }
      return null;
    }

    // 3. Render Calendars for August, September, October, November 2026
    function renderCalendars() {
      const container = document.getElementById("calendar-container");
      container.innerHTML = "";

      academicCalendarData.months.forEach(m => {
        const monthCard = document.createElement("div");
        monthCard.className = "month-card";

        const header = document.createElement("div");
        header.className = "month-header";
        header.innerText = m.name;
        monthCard.appendChild(header);

        // Days Header (Monday start)
        const daysHeader = document.createElement("div");
        daysHeader.className = "month-days-header";
        const dayNames = ["LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO", "DOMINGO"];
        daysHeader.innerHTML = dayNames.map(d => `<div>${d}</div>`).join('');
        monthCard.appendChild(daysHeader);

        // Grid
        const grid = document.createElement("div");
        grid.className = "month-grid";

        // Generate day cells for month
        const year = m.year;
        const monthIdx = m.monthIdx; // 7 = Aug, 8 = Sept, 9 = Oct, 10 = Nov

        // First day of month date object
        const firstDay = new Date(year, monthIdx, 1);
        // Get day of week (Monday = 0 ... Sunday = 6)
        let firstDayOfWeek = (firstDay.getDay() + 6) % 7; 

        // Days in current month
        const totalDays = new Date(year, monthIdx + 1, 0).getDate();
        // Days in previous month
        const prevMonthTotalDays = new Date(year, monthIdx, 0).getDate();

        let dayCount = 1;
        let nextMonthDayCount = 1;

        // 5 or 6 rows of 7 days = 35 or 42 cells
        const totalCells = Math.ceil((firstDayOfWeek + totalDays) / 7) * 7;

        for (let cellIdx = 0; cellIdx < totalCells; cellIdx++) {
          const cell = document.createElement("div");
          cell.className = "day-cell";

          let cellDateStr = "";
          let isCurrentMonth = false;

          if (cellIdx < firstDayOfWeek) {
            // Previous month day
            const dayNum = prevMonthTotalDays - (firstDayOfWeek - cellIdx - 1);
            cell.classList.add("other-month");
            cell.innerHTML = `<div class="day-number">${dayNum}</div>`;
            const prevMonthIdx = monthIdx - 1;
            const pMonthFormatted = String(prevMonthIdx + 1).padStart(2, '0');
            cellDateStr = `${year}-${pMonthFormatted}-${String(dayNum).padStart(2, '0')}`;
          } else if (dayCount <= totalDays) {
            // Current month day
            cell.innerHTML = `<div class="day-number">${dayCount}</div>`;
            isCurrentMonth = true;
            const mMonthFormatted = String(monthIdx + 1).padStart(2, '0');
            cellDateStr = `${year}-${mMonthFormatted}-${String(dayCount).padStart(2, '0')}`;
            dayCount++;
          } else {
            // Next month day
            cell.classList.add("other-month");
            cell.innerHTML = `<div class="day-number">${nextMonthDayCount}</div>`;
            const nextMonthIdx = monthIdx + 1;
            const nMonthFormatted = String(nextMonthIdx + 1).padStart(2, '0');
            cellDateStr = `${year}-${nMonthFormatted}-${String(nextMonthDayCount).padStart(2, '0')}`;
            nextMonthDayCount++;
          }

          // Populate events occurring on this cellDateStr
          renderEventsForDayCell(cell, cellDateStr, isCurrentMonth);

          grid.appendChild(cell);
        }

        monthCard.appendChild(grid);
        container.appendChild(monthCard);
      });
    }

    // Helper: Find & render events for a specific cell date
    function renderEventsForDayCell(cellElement, dateStr, isCurrentMonth) {
      const normalizedQuery = normalizeStr(searchQuery);

      academicCalendarData.subjects.forEach(subject => {
        // If subject highlight filter active and not matching, dim or skip
        const isSubjectActive = !selectedSubjectId || selectedSubjectId === subject.id;

        subject.events.forEach(ev => {
          if (!ev.startDate) return;

          // Check if dateStr falls in [startDate, endDate]
          if (dateStr >= ev.startDate && dateStr <= ev.endDate) {
            // Check category filter
            if (selectedCategory && ev.category !== selectedCategory) return;
            // Check search filter
            if (normalizedQuery && !normalizeStr(ev.title).includes(normalizedQuery) && !normalizeStr(subject.name).includes(normalizedQuery)) return;

            const cat = getCategory(ev.category);
            const pill = document.createElement("div");
            pill.className = `event-pill cat-${ev.category}`;
            
            if (!isSubjectActive) {
              pill.classList.add("dimmed");
            } else if (selectedSubjectId === subject.id) {
              pill.classList.add("highlighted-pill");
            }

            // Display text format
            let displayLabel = `${subject.name.split(' ')[0]}: ${ev.title}`;
            if (ev.startDate === ev.endDate) {
              displayLabel = `${ev.title} (${subject.name})`;
            }

            pill.innerText = displayLabel;
            pill.title = `${subject.name} - ${ev.title} (${ev.dateStr})`;
            pill.onclick = (e) => {
              e.stopPropagation();
              openEventModal(ev.id);
            };

            cellElement.appendChild(pill);
          }
        });
      });
    }

    /* ==========================================================================
       INTERACTIVE CONTROLS & MODAL
       ========================================================================== */
    function filterCategory(catId) {
      if (selectedCategory === catId) {
        selectedCategory = null;
      } else {
        selectedCategory = catId;
      }

      // Update UI legend active states
      document.querySelectorAll('.legend-item').forEach(el => {
        if (el.dataset.category === selectedCategory) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      renderSidebarSubjects();
      renderCalendars();
    }

    function toggleSubjectHighlight(subjectId) {
      if (selectedSubjectId === subjectId) {
        selectedSubjectId = null;
      } else {
        selectedSubjectId = subjectId;
      }
      renderSidebarSubjects();
      renderCalendars();
    }

    function resetFilters() {
      selectedCategory = null;
      selectedSubjectId = null;
      searchQuery = "";
      document.getElementById("search-input").value = "";

      document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('active'));
      renderSidebarSubjects();
      renderCalendars();
    }

    function setupSearch() {
      const input = document.getElementById("search-input");
      input.addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderSidebarSubjects();
        renderCalendars();
      });
    }

    function openEventModal(eventId) {
      const data = getSubjectByEvent(eventId);
      if (!data) return;

      const { subject, event } = data;
      const cat = getCategory(event.category);

      document.getElementById("modal-title").innerText = event.title;
      document.getElementById("modal-body").innerHTML = `
        <div class="modal-field">
          <span class="modal-label">Materia:</span>
          <span class="modal-value">${subject.name}</span>
        </div>
        <div class="modal-field">
          <span class="modal-label">Tipo de Evento:</span>
          <span class="modal-value" style="color: ${cat.color}">${cat.label}</span>
        </div>
        <div class="modal-field">
          <span class="modal-label">Fecha / Periodo:</span>
          <span class="modal-value">${event.dateStr}</span>
        </div>
        ${event.startDate ? `
          <div class="modal-field">
            <span class="modal-label">Rango en Calendario:</span>
            <span class="modal-value">${event.startDate} al ${event.endDate}</span>
          </div>
        ` : ''}
      `;

      document.getElementById("event-modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("event-modal").classList.remove("active");
    }

    // Close modal on escape key
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
  </script>
